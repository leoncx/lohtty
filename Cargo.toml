[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/lohtty"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
lohtty-config = { path = "crates/lohtty-config" }
lohtty-theme = { path = "crates/lohtty-theme" }
lohtty-term = { path = "crates/lohtty-term" }
lohtty-ui = { path = "crates/lohtty-ui" }

# Pinned exactly: gpui is pre-1.0 and breaks between releases.
gpui = "=0.2.2"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
