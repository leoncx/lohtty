[package]
name = "lohtty-term"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal = "0.26"
portable-pty = "0.9"
async-channel = "2.5"
anyhow.workspace = true
tracing.workspace = true
dirs.workspace = true
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# The shell's working directory and host name; shared memory image
# transmission (kitty graphics).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The kitty graphics protocol (see `kitty` module).
kitty-graphics = ["dep:base64", "dep:flate2", "dep:image"]

[lints]
workspace = true
