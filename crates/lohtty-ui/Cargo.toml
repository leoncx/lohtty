[package]
name = "lohtty-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
lohtty-config.workspace = true
lohtty-theme.workspace = true
lohtty-term.workspace = true
lohtty-usage.workspace = true
alacritty_terminal = "0.26"
async-channel = "2.5"
anyhow.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, optional = true }

[features]
# Kitty graphics protocol: images drawn in the terminal.
kitty-graphics = ["lohtty-term/kitty-graphics", "dep:image"]

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Notification Center and the Dock (objc2, as gpui uses).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[lints]
workspace = true
