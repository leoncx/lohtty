[package]
name = "lohtty"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
lohtty-config.workspace = true
lohtty-theme.workspace = true
lohtty-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["kitty-graphics"]
# Kitty graphics protocol; build with --no-default-features to leave it out.
kitty-graphics = ["lohtty-ui/kitty-graphics"]

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
