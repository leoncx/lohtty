name: Release

# Push a tag vX.Y.Z to release. The tag must match the lohtty crate version
# and have a `## [X.Y.Z]` section in CHANGELOG.md (scripts/release-check.ps1).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check version and changelog
        shell: pwsh
        run: ./scripts/release-check.ps1 -Tag "${{ github.ref_name }}" -NotesOut notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  windows:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        # ARM64 is cross-compiled on the x64 runner, so it isn't launched.
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install WiX 5
        # v5 (MS-RL); v6+ adds the Open Source Maintenance Fee EULA.
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Target ${{ matrix.target }} -Msi
      - name: Smoke test
        if: startsWith(matrix.target, 'x86_64')
        shell: pwsh
        run: |
          # The exe must start and keep running (it has a window, so no output).
          $exe = "target/${{ matrix.target }}/release/lohtty.exe"
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "lohtty exited early with code $($p.ExitCode)" }
          $p.Kill()
      - name: Installer test
        if: startsWith(matrix.target, 'x86_64')
        shell: pwsh
        run: |
          # Per-user install, launch, uninstall; nothing may be left behind.
          $msi = (Get-ChildItem dist/*.msi).FullName
          $dir = "$env:LOCALAPPDATA\Programs\lohtty"
          $run = { param($verb) (Start-Process msiexec.exe -ArgumentList @($verb, $msi, '/qn') -Wait -PassThru).ExitCode }
          if ((& $run '/i') -ne 0) { throw 'install failed' }
          if (-not (Test-Path "$dir\lohtty.exe")) { throw 'lohtty.exe not installed' }
          $p = Start-Process "$dir\lohtty.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "installed lohtty exited early ($($p.ExitCode))" }
          $p.Kill(); $p.WaitForExit()
          if ((& $run '/x') -ne 0) { throw 'uninstall failed' }
          if (Test-Path $dir) { throw 'install folder left behind' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  linux:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        # Built on the oldest supported distribution: the binary needs at
        # least its glibc (2.35). The ARM runner is free for public repos only.
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libssl-dev \
            patchelf xvfb mesa-vulkan-drivers
      - name: Package
        run: scripts/package-linux.sh --appimage
      - name: Smoke test
        run: |
          # Both builds must start and keep running on a virtual display
          # (software Vulkan; nothing is checked on screen).
          Xvfb :99 -screen 0 1280x800x24 & sleep 2
          export DISPLAY=:99 APPIMAGE_EXTRACT_AND_RUN=1
          tar -C "$RUNNER_TEMP" -xzf "$(ls dist/lohtty-*.tar.gz | grep -v -- -debug.tar.gz)"
          for exe in "$RUNNER_TEMP"/lohtty-*/lohtty dist/lohtty-*.AppImage; do
            "$exe" & pid=$!
            sleep 5
            kill -0 $pid || { wait $pid; echo "$exe exited early ($?)"; exit 1; }
            kill $pid
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Package
        run: scripts/package-macos.sh
      - name: Smoke test
        run: |
          # The app from the disk image must be universal, signed, and start
          # and keep running.
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          app="$RUNNER_TEMP/dmg/lohtty.app"
          lipo -archs "$app/Contents/MacOS/lohtty"
          codesign --verify --strict "$app"
          "$app/Contents/MacOS/lohtty" & pid=$!
          sleep 5
          kill -0 $pid || { wait $pid; echo "lohtty exited early ($?)"; exit 1; }
          kill $pid
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [check, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir release
          find artifacts \( -name '*.zip' -o -name '*.msi' -o -name '*.tar.gz' \
            -o -name '*.AppImage' -o -name '*.dmg' \) -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/notes/notes.md
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
